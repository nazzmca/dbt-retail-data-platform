version: 2

sources:
  - name: retail_raw
    database: dev
    schema: main
    description: "Raw retail order data"

    tables:
      - name: raw_orders
        description: "Raw orders loaded into DuckDB"

        columns:
          - name: order_id
            description: "Unique order identifier"
            data_tests:
              - unique
              - not_null

          - name: customer_id
            description: "Customer identifier"
            data_tests:
              - not_null

          - name: product_id
            description: "Product identifier"
            data_tests:
              - not_null

          - name: order_date
            description: "Date of the order"
            data_tests:
              - not_null